spring:
  application:
    name: spendwise-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:spendwise_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8081,http://localhost:8082,http://127.0.0.1:8082}
  gemini:
    api-key: ${GEMINI_API_KEY:demo-key}
    model: gemini-1.5-flash
    rate-limit-per-minute: 10

logging:
  level:
    com.spendwiseai: DEBUG
    org.springframework.security: INFO

