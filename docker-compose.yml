version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spendwise-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: spendwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: spendwise-backend
    ports:
      - "8888:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/spendwise_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespassword
      - DATABASE_DRIVER=org.postgresql.Driver
      - JPA_DDL_AUTO=validate
      - FLYWAY_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo-key}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:8082
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
